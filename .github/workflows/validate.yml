name: Validar site
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sabor-express/package-lock.json
      - run: npm ci
      - run: npm ci --prefix sabor-express
      - run: npm run build
      - run: npm test
      - run: npm run check
      - run: npm run smoke
